name: Daily Study Routine

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = Bangladesh 04:00 (UTC+6)
  workflow_dispatch:        # manual trigger for testing

jobs:
  send-routine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore state file
        uses: actions/cache@v4
        with:
          path: state.json
          key: study-state-${{ github.run_number }}
          restore-keys: |
            study-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save updated state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: study-state-${{ github.run_number }}
