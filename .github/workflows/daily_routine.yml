name: Daily Study Routine

on:
  schedule:
    - cron: '0 22 * * *'    # BD 04:00 — Morning Routine
    - cron: '0 19 * * *'    # BD 01:00 — Collect Questions
    - cron: '0 6 * * *'     # BD 12:00 — Non-Dept Batch 0
    - cron: '0 7 * * *'     # BD 13:00 — Non-Dept Batch 1
    - cron: '0 8 * * *'     # BD 14:00 — Non-Dept Batch 2
    - cron: '0 9 * * *'     # BD 15:00 — Non-Dept Batch 3
    - cron: '30 9 * * *'    # BD 15:30 — EEE Batch 0
    - cron: '15 10 * * *'   # BD 16:15 — EEE Batch 1
    - cron: '0 11 * * *'    # BD 17:00 — EEE Batch 2
    - cron: '45 11 * * *'   # BD 17:45 — EEE Batch 3
    - cron: '30 12 * * *'   # BD 18:30 — EEE Batch 4
    - cron: '15 13 * * *'   # BD 19:15 — EEE Batch 5
    - cron: '0 14 * * *'    # BD 20:00 — EEE Batch 6
  workflow_dispatch:
    inputs:
      job_type:
        description: 'routine / quiz'
        required: true
        default: 'quiz'
        type: choice
        options: [routine, quiz, collect, bank_quiz]
      batch_num:
        description: 'Batch (0-3=Non-Dept, 4-10=EEE)'
        required: false
        default: '0'

jobs:
  # ── ভোর ৪টা — Morning Routine ──────────────────────────
  send-routine:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'routine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install httpx

      - name: Run routine bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit updated state.json
        run: |
          git config user.name "StudyBot"
          git config user.email "bot@study.local"
          git add state.json
          git diff --staged --quiet || git commit -m "state: day advanced [skip ci]"
          git push

  # ── Quiz Batches ────────────────────────────────────────
  send-quiz:
    if: >
      (github.event_name == 'schedule' && github.event.schedule != '0 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'quiz')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install httpx

      - name: Run quiz batch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID:  ${{ secrets.GROUP_ID }}
          BATCH_NUM: >-
            ${{
              github.event_name == 'workflow_dispatch' && github.event.inputs.batch_num ||
              github.event.schedule == '0 6 * * *'   && '0' ||
              github.event.schedule == '0 7 * * *'   && '1' ||
              github.event.schedule == '0 8 * * *'   && '2' ||
              github.event.schedule == '0 9 * * *'   && '3' ||
              github.event.schedule == '30 9 * * *'  && '4' ||
              github.event.schedule == '15 10 * * *' && '5' ||
              github.event.schedule == '0 11 * * *'  && '6' ||
              github.event.schedule == '45 11 * * *' && '7' ||
              github.event.schedule == '30 12 * * *' && '8' ||
              github.event.schedule == '15 13 * * *' && '9' ||
              '10'
            }}
        run: python quiz_bot.py

  # ── রাত ১টা — Collect Questions from Images ────────────
  collect-questions:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'collect')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx
      - name: Collect questions from images
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          GROUP_ID:        ${{ secrets.GROUP_ID }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
        run: python collect_questions.py
      - name: Commit updated question bank
        run: |
          git config user.name "StudyBot"
          git config user.email "bot@study.local"
          git add questions_bank.json
          git diff --staged --quiet || git commit -m "bank: new questions added [skip ci]"
          git push

  # ── দুপুর ১২টা — Non-Dept Quiz from Bank ───────────────
  send-bank-quiz:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'bank_quiz')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install httpx
      - name: Send quiz from bank
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID:  ${{ secrets.GROUP_ID }}
        run: python quiz_bot_bank.py
      - name: Save updated bank (sent_indices)
        run: |
          git config user.name "StudyBot"
          git config user.email "bot@study.local"
          git add questions_bank.json
          git diff --staged --quiet || git commit -m "bank: sent indices updated [skip ci]"
          git push
